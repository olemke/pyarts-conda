context:
  name: pyarts
  version: 2.6.19
  git_url: https://github.com/atmtools/arts

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  # url: ${{ git_url }}/archive/refs/tags/v${{ version }}.tar.gz
  # sha256: cccf67ac2c061f73d3b1ddbc02c782aa8d0cf1c1d9f6e61d5491d88b4845eee6
  git: ${{ git_url }}.git
  rev: v2.6.x

build:
  number: 2

requirements:
  build:
    # If your project compiles code (such as a C extension) then add the required compilers as separate entries here.
    # Compilers are named 'c', 'cxx' and 'fortran'.
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - cmake >=3.20
    - if: unix
      then:
        - make
  host:
    - python
    - docutils
    - glew=2.3
    - glfw<3.5
    - lark-parser
    - if: linux
      then:
      - libgl-devel
      - libgomp
      - nomkl
      - openblas * *openmp*
    - libmicrohttpd=1.0.2
    - if: osx
      then:
      - llvm-openmp
    - matplotlib
    - netcdf4
    - libnetcdf=4.9.3
    - numpy<3
    - pip
    - pytest
    - pytest-runner
    - python-build
    - scipy
    - setuptools
    - tqdm
    - xarray
    - zlib
  run:
    - python
    - glew=2.3
    - glfw<3.5
    - libmicrohttpd=1.0.2
    - if: linux
      then:
      - libopenblas * *openmp*
    - matplotlib
    - netcdf4
    - libnetcdf=4.9.3
    - ${{ pin_compatible('numpy', lower_bound='1.22', upper_bound='3.0.0') }}
    - scipy
    - tqdm
    - xarray
    - zlib


about:
  homepage: https://github.com/atmtools/arts
  summary: 'The Atmospheric Radiative Transfer Simulator'
  description: |
      Python interface to ARTS
  # License abbr. according to https://spdx.org/licenses/
  license: GPL-3.0-or-later
  # It is required to include a license file in the package,
  # (even if the license doesn't require it) using the license_file entry.
  # Please also note that some projects have multiple license files which all need to be added using a valid yaml list.
  # See https://docs.conda.io/projects/conda-build/en/latest/resources/define-metadata.html#license-file
  license_file:
    - LICENSE.txt
    - vendor-licenses/
  # The doc_url and dev_url are optional.
  documentation: https://atmtools.github.io/arts-docs-2.6/
  repository: https://github.com/atmtools/arts

extra:
  recipe-maintainers:
    - olemke
